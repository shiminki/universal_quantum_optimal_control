model:
  type: deep_nn
  pulse_space:
    phi: [-3.15, 3.15]
    tau: [0.01, 0.5]
  num_pulses: 400
  hidden_mult: 6
  n_layers: 6

training:
  batch_size: 16
  epochs: 50
  monte_carlo: 1000
  learning_rate: 3.0e-5
  grad_clip: 1.0
  loss: infidelity
  error_sampler: ore_ple
  curriculum:
    - {delta_std: 0.4, epsilon_std: 0.05}
    - {delta_std: 0.7, epsilon_std: 0.05}
    - {delta_std: 1.0, epsilon_std: 0.05}

dataset:
  train_size: 8192
  eval_size: 1024
  random: true

seed: 42
