# High-disorder hBN target: Ω = 30 MHz, δ ~ N(0, (3Ω)²), 300 MHz AWG bandwidth.
model:
  type: transformer
  num_qubits: 1
  pulse_space:
    phi: [-3.15, 3.15]
    tau: [0.1, 0.5]
  max_pulses: 50
  d_model: 512
  n_layers: 8
  n_heads: 16
  dropout: 0.1
  finetune: null

physics:
  omega_mhz: 30.0            # Rabi frequency (down from 50 MHz)

bandwidth:
  mode: both                 # none | filter | penalty | both
  cutoff_mhz: 300.0          # AWG limit = 10 Ω
  penalty_weight: 1.0        # penalty on post-filter residual slew
  max_radius: 32
  oversample: 8              # fine-grid points per segment for the filter

training:
  batch_size: 512
  epochs: 100
  monte_carlo: 1024
  learning_rate: 3.0e-5
  grad_clip: 1.0
  loss: sharp_rotation       # sharp_loss(F) + λ·MSE(θ_target, θ_out)
  loss_params:
    rotation_weight: 1.0     # λ
    tau: 0.99
    k: 100.0
  error_sampler: ore_mhz     # δ_MHz ~ N(0, delta_std_mhz²), normalised by Ω
  curriculum:                # ramp to δ ~ N(0, 9Ω²): 3Ω = 90 MHz
    - {delta_std_mhz: 30.0}
    - {delta_std_mhz: 60.0}
    - {delta_std_mhz: 90.0}

dataset:
  train_size: 16384
  eval_size: 1024
  random: false

seed: 0
